name: Android TV app

on:
  push:
    paths:
      - "clients/androidtv/**"
      - ".github/workflows/androidtv.yml"
  pull_request:
    paths:
      - "clients/androidtv/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/androidtv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: homeos-tv-apk
          path: clients/androidtv/app/build/outputs/apk/debug/app-debug.apk
